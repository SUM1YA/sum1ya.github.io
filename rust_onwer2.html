<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust Ownership & Borrowing — Interactive Explainer</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-2: #171a21;
    --bg-3: #1f232c;
    --bg-4: #262b36;
    --border: #2d3340;
    --border-2: #3a4150;
    --text: #e6e8ee;
    --text-dim: #9aa3b2;
    --text-mute: #6b7280;
    --rust: #dea584;
    --rust-2: #f5b88a;
    --accent: #f5a524;
    --info: #60a5fa;
    --success: #4ade80;
    --warn: #fbbf24;
    --error: #f87171;
    --move: #fb923c;
    --borrow: #22d3ee;
    --mut-borrow: #c084fc;
    --shadow: 0 10px 30px rgba(0,0,0,0.4);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; border-radius: 6px; }

  .app {
    max-width: 1440px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 22px;
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: radial-gradient(circle at 30% 30%, #f5b88a, #b8621b);
    display: grid; place-items: center;
    font-weight: 800; font-size: 22px; color: #1a1a1a;
    box-shadow: 0 6px 20px rgba(222,165,132,0.3);
  }
  .brand-title { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .brand-sub { font-size: 12px; color: var(--text-dim); }
  .progress-wrap { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }
  .progress-bar {
    width: 180px; height: 6px;
    background: var(--bg-4);
    border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rust), var(--accent));
    transition: width 0.4s ease;
    border-radius: 999px;
  }

  /* Topic tabs */
  .topics {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .topic-btn {
    padding: 12px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    text-align: left;
    transition: all 0.2s ease;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .topic-btn:hover { border-color: var(--border-2); background: var(--bg-3); }
  .topic-btn.active {
    background: linear-gradient(135deg, rgba(222,165,132,0.15), rgba(245,165,36,0.08));
    border-color: var(--rust);
    box-shadow: 0 0 0 1px var(--rust) inset;
  }
  .topic-num {
    font-size: 11px;
    color: var(--rust);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .topic-sig {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .topic-label { font-size: 11px; color: var(--text-dim); }

  /* Workspace */
  .workspace {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 16px;
  }
  .panel {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-head {
    padding: 12px 16px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rust);
    box-shadow: 0 0 8px var(--rust);
  }
  .panel-meta { font-size: 11px; color: var(--text-dim); font-family: monospace; }

  /* Visual */
  .visual {
    flex: 1;
    padding: 18px;
    min-height: 360px;
    position: relative;
    background:
      radial-gradient(circle at 20% 10%, rgba(222,165,132,0.08), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(96,165,250,0.06), transparent 50%),
      var(--bg-2);
  }
  .visual svg { width: 100%; height: 100%; display: block; }

  /* Code */
  .code-wrap {
    flex: 1;
    overflow: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .code-table { width: 100%; border-collapse: collapse; }
  .code-line {
    transition: background 0.25s ease;
    cursor: pointer;
  }
  .code-line:hover { background: rgba(255,255,255,0.03); }
  .code-line.active {
    background: linear-gradient(90deg, rgba(222,165,132,0.18), rgba(222,165,132,0.04));
    box-shadow: inset 3px 0 0 var(--rust);
  }
  .code-line.done { background: rgba(74,222,128,0.04); }
  .code-line.future { opacity: 0.55; }
  .code-line td { padding: 2px 12px; vertical-align: top; white-space: pre; }
  .ln-num {
    width: 40px;
    color: var(--text-mute);
    text-align: right;
    user-select: none;
    padding-right: 14px !important;
    border-right: 1px solid var(--border);
  }
  .code-line.active .ln-num { color: var(--rust); font-weight: 700; }

  /* Syntax colors */
  .tok-kw { color: #ff79c6; }
  .tok-fn { color: #8be9fd; }
  .tok-str { color: #f1fa8c; }
  .tok-num { color: #bd93f9; }
  .tok-com { color: #6272a4; font-style: italic; }
  .tok-ty { color: #8be9fd; font-style: italic; }
  .tok-mac { color: #50fa7b; }
  .tok-mut { color: #ffb86c; font-weight: 600; }
  .tok-op { color: #ff79c6; }
  .tok-var { color: #e6e8ee; }

  /* Info panels */
  .info-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
  }
  .explain {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .step-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--rust-2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-badge {
    font-size: 11px;
    padding: 3px 8px;
    background: rgba(222,165,132,0.15);
    border: 1px solid var(--rust);
    border-radius: 999px;
    color: var(--rust-2);
    font-weight: 600;
  }
  .explain-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .explain-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-mute);
    font-weight: 700;
  }
  .explain-text { font-size: 13px; color: var(--text); line-height: 1.65; }
  .explain-text code {
    background: var(--bg-4);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    color: var(--rust-2);
  }

  /* Inspector */
  .inspector { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .insp-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .insp-list { display: flex; flex-direction: column; gap: 6px; }
  .insp-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 12px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: monospace;
    font-size: 12px;
    transition: all 0.3s ease;
  }
  .insp-row.changed {
    border-color: var(--rust);
    background: rgba(222,165,132,0.08);
    animation: pulse 0.6s ease;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .insp-name { color: var(--info); font-weight: 600; }
  .insp-val { color: var(--text); }
  .insp-type { color: var(--text-mute); font-size: 11px; }
  .insp-change {
    font-size: 11px;
    color: var(--warn);
    padding: 2px 6px;
    background: rgba(251,191,36,0.1);
    border-radius: 4px;
  }

  /* Controls */
  .controls {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 8px 14px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    color: var(--text);
  }
  .ctrl-btn:hover:not(:disabled) {
    background: var(--bg-4);
    border-color: var(--border-2);
    transform: translateY(-1px);
  }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.primary {
    background: linear-gradient(135deg, var(--rust), #c48a5a);
    color: #1a1a1a;
    border-color: var(--rust);
  }
  .ctrl-btn.primary:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--rust-2), var(--rust));
  }
  .speed-group {
    display: flex;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .speed-btn {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    transition: all 0.15s ease;
  }
  .speed-btn.active {
    background: var(--rust);
    color: #1a1a1a;
  }
  .step-counter {
    margin-left: auto;
    font-family: monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Timeline */
  .timeline {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 4px 0;
  }
  .timeline::-webkit-scrollbar { height: 4px; }
  .timeline::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
  .tl-step {
    flex: 0 0 auto;
    padding: 6px 10px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    transition: all 0.15s ease;
    font-weight: 500;
  }
  .tl-step:hover { border-color: var(--border-2); color: var(--text); }
  .tl-step.active {
    background: var(--rust);
    color: #1a1a1a;
    border-color: var(--rust);
    font-weight: 700;
  }
  .tl-step.done {
    background: rgba(74,222,128,0.1);
    border-color: rgba(74,222,128,0.3);
    color: var(--success);
  }

  /* SVG styles */
  .box {
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .box-rect {
    fill: var(--bg-3);
    stroke: var(--border-2);
    stroke-width: 1.5;
    transition: all 0.4s ease;
  }
  .box.owner .box-rect { stroke: var(--rust); stroke-width: 2; fill: rgba(222,165,132,0.08); }
  .box.mut .box-rect { stroke: var(--warn); stroke-width: 2; fill: rgba(251,191,36,0.08); }
  .box.borrow .box-rect { stroke: var(--borrow); stroke-width: 2; fill: rgba(34,211,238,0.08); }
  .box.mut-borrow .box-rect { stroke: var(--mut-borrow); stroke-width: 2; fill: rgba(192,132,252,0.08); }
  .box.moved .box-rect { stroke: var(--error); stroke-width: 2; stroke-dasharray: 4 3; fill: rgba(248,113,113,0.06); opacity: 0.5; }
  .box-label { fill: var(--text); font-size: 13px; font-weight: 600; font-family: monospace; }
  .box-value { fill: var(--rust-2); font-size: 14px; font-weight: 700; font-family: monospace; }
  .box-type { fill: var(--text-mute); font-size: 10px; font-family: monospace; }
  .box-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-family: sans-serif;
  }
  .arrow {
    fill: none;
    stroke-width: 2;
    transition: all 0.4s ease;
  }
  .arrow.own { stroke: var(--rust); }
  .arrow.borrow { stroke: var(--borrow); stroke-dasharray: 5 3; }
  .arrow.mut-borrow { stroke: var(--mut-borrow); stroke-dasharray: 5 3; }
  .arrow.moved { stroke: var(--error); stroke-dasharray: 3 3; opacity: 0.6; }
  .arrow-label {
    font-size: 10px;
    font-family: monospace;
    font-weight: 600;
    fill: var(--text-dim);
  }
  .region-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    fill: var(--text-mute);
    font-family: sans-serif;
  }
  .region-box {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 3 3;
  }
  .heap-box {
    fill: rgba(222,165,132,0.04);
    stroke: var(--rust);
    stroke-width: 1.5;
    stroke-dasharray: 4 2;
  }
  .heap-text { fill: var(--rust-2); font-family: monospace; font-size: 14px; font-weight: 600; }
  .note {
    font-size: 11px;
    fill: var(--text-dim);
    font-family: sans-serif;
  }
  .error-note {
    font-size: 12px;
    fill: var(--error);
    font-weight: 700;
    font-family: sans-serif;
  }
  .success-note {
    font-size: 12px;
    fill: var(--success);
    font-weight: 700;
    font-family: sans-serif;
  }
  .flash { animation: flash 0.8s ease; }
  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .move-particle {
    fill: var(--move);
    animation: moveDot 0.8s ease;
  }
  @keyframes moveDot {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 960px) {
    .workspace { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .topics { grid-template-columns: repeat(3, 1fr); }
    .progress-bar { width: 120px; }
  }
  @media (max-width: 560px) {
    .topics { grid-template-columns: repeat(2, 1fr); }
    .app { padding: 12px; }
    .header { padding: 14px; }
    .brand-title { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">🦀</div>
      <div>
        <div class="brand-title">Rust Ownership & Borrowing</div>
        <div class="brand-sub">Interactive Explainer · 6 Patterns · Line-by-Line Walkthrough</div>
      </div>
    </div>
    <div class="progress-wrap">
      <span id="progressText">ขั้นตอนที่ 1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
    </div>
  </header>

  <!-- Topics -->
  <nav class="topics" id="topics" aria-label="เลือกหัวข้อ"></nav>

  <!-- Workspace -->
  <section class="workspace">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot"></span><span>ภาพจำลองหน่วยความจำ</span></div>
        <div class="panel-meta" id="visMeta">Stack · Heap · Ownership</div>
      </div>
      <div class="visual" id="visual"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" style="background:var(--info);box-shadow:0 0 8px var(--info)"></span><span>ซอร์สโค้ด</span></div>
        <div class="panel-meta" id="codeMeta">main.rs · Rust</div>
      </div>
      <div class="code-wrap" id="codeWrap"></div>
    </div>
  </section>

  <!-- Info grid -->
  <section class="info-grid">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" style="background:var(--success);box-shadow:0 0 8px var(--success)"></span><span>คำอธิบายขั้นตอน</span></div>
      </div>
      <div class="explain" id="explain"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" style="background:var(--warn);box-shadow:0 0 8px var(--warn)"></span><span>ตัวแปรและสถานะ</span></div>
      </div>
      <div class="inspector" id="inspector"></div>
    </div>
  </section>

  <!-- Controls -->
  <section class="controls">
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnReplay" title="เล่นใหม่">⟲ เล่นใหม่</button>
      <button class="ctrl-btn" id="btnPrev" title="ขั้นตอนก่อน">◀ ก่อนหน้า</button>
      <button class="ctrl-btn primary" id="btnPlay" title="เล่น/หยุด">▶ เล่น</button>
      <button class="ctrl-btn" id="btnNext" title="ขั้นตอนถัดไป">ถัดไป ▶</button>
      <div class="speed-group" role="group" aria-label="ความเร็ว">
        <button class="speed-btn" data-speed="0.5">0.5×</button>
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
      </div>
      <div class="step-counter" id="stepCounter">1 / 10</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

</div>

<script>
/* ============================================================
   Rust Ownership & Borrowing — Interactive Explainer
   ============================================================ */

/* ---------- Rust syntax highlighter (simple tokenizer) ---------- */
const RUST_KEYWORDS = new Set(['fn','let','mut','if','else','while','for','in','return','match','struct','enum','impl','trait','pub','use','mod','self','Self','super','where','as','ref','const','static','unsafe','extern','crate','loop','break','continue','move','async','await','dyn','type']);
const RUST_TYPES = new Set(['String','i32','i64','u32','u64','usize','f32','f64','bool','char','Vec','Option','Result','&str']);

function highlightRust(code) {
  // Escape HTML
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Comments
  s = s.replace(/(\/\/[^\n]*)/g, '<span class="tok-com">$1</span>');
  // Strings
  s = s.replace(/("(?:\\.|[^"\\])*")/g, '<span class="tok-str">$1</span>');
  // Macros (name!)
  s = s.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)!/g, '<span class="tok-mac">$1!</span>');
  // Numbers
  s = s.replace(/\b(\d+)\b/g, '<span class="tok-num">$1</span>');
  // Function calls
  s = s.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, (m, name) => {
    if (RUST_KEYWORDS.has(name)) return m;
    return `<span class="tok-fn">${name}</span>(`;
  });
  // Types (capitalized identifiers in type positions)
  s = s.replace(/\b([A-Z][a-zA-Z0-9_]*)\b/g, (m, name) => {
    if (RUST_TYPES.has(name) || /^[A-Z]/.test(name)) {
      return `<span class="tok-ty">${name}</span>`;
    }
    return m;
  });
  // Keywords (must come after types)
  s = s.replace(/\b(mut|let|fn|if|else|while|for|in|return|match|struct|enum|impl|trait|pub|use|mod|self|Self|ref|const|move)\b/g, '<span class="tok-kw">$1</span>');
  return s;
}

/* ---------- Topic definitions ---------- */
const TOPICS = [
  {
    id: 1,
    sig: 'x: T',
    label: 'Move & Immutable',
    title: 'การ Move ค่าแบบ Immutable',
    intro: 'เมื่อเราผูกค่ากับตัวแปรโดยไม่มี mut ค่าจะเป็น immutable และเมื่อส่งต่อให้ตัวแปรอื่น ค่าจะถูก "move" ออกไป ทำให้ตัวแปรเดิมใช้งานไม่ได้อีก',
    code: [

/* ---------- State ---------- */
const state = {
  topicIdx: 0,
  stepIdx: 0,
  isPlaying: false,
  speed: 1,
  timer: null
};

/* ---------- DOM refs ---------- */
const $ = (id) => document.getElementById(id);
const topicsEl = $('topics');
const visualEl = $('visual');
const codeWrap = $('codeWrap');
const explainEl = $('explain');
const inspectorEl = $('inspector');
const timelineEl = $('timeline');
const progressFill = $('progressFill');
const progressText = $('progressText');
const stepCounter = $('stepCounter');
const btnPlay = $('btnPlay');
const btnPrev = $('btnPrev');
const btnNext = $('btnNext');
const btnReplay = $('btnReplay');

/* ---------- Render topics ---------- */
function renderTopics() {
  topicsEl.innerHTML = TOPICS.map((t, i) => `
    <button class="topic-btn ${i === state.topicIdx ? 'active' : ''}" data-topic="${i}" aria-label="${t.sig} ${t.label}">
      <div class="topic-num">#${t.id}</div>
      <div class="topic-sig">${escapeHtml(t.sig)}</div>
      <div class="topic-label">${escapeHtml(t.label)}</div>
    </button>
  `).join('');
  topicsEl.querySelectorAll('.topic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.topicIdx = parseInt(btn.dataset.topic);
      state.stepIdx = 0;
      pause();
      renderAll();
    });
  });
}

/* ---------- Render code panel ---------- */
function renderCode() {
  const topic = TOPICS[state.topicIdx];
  const step = topic.steps[state.stepIdx];
  const activeLines = new Set(step.lines);
  const maxActive = Math.max(...step.lines);

  let html = '<table class="code-table"><tbody>';
  topic.code.forEach((line, i) => {
    const ln = i + 1;
    let cls = 'code-line';
    if (activeLines.has(ln)) cls += ' active';
    else if (ln < maxActive) cls += ' done';
    else cls += ' future';
    html += `<tr class="${cls}" data-line="${ln}">
      <td class="ln-num">${ln}</td>
      <td class="ln-code">${highlightRust(line) || '&nbsp;'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  codeWrap.innerHTML = html;

  // scroll active into view
  const activeRow = codeWrap.querySelector('.code-line.active');
  if (activeRow) {
    activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // click line to jump to step that contains it
  codeWrap.querySelectorAll('.code-line').forEach(row => {
    row.addEventListener('click', () => {
      const ln = parseInt(row.dataset.line);
      const idx = topic.steps.findIndex(s => s.lines.includes(ln));
      if (idx >= 0) {
        state.stepIdx = idx;
        renderAll();
      }
    });
  });
}

/* ---------- Render visual (SVG) ---------- */
function renderVisual() {
  const topic = TOPICS[state.topicIdx];
  const step = topic.steps[state.stepIdx];
  visualEl.innerHTML = buildSvg(step.visual, topic.id);
}

function buildSvg(kind, topicId) {
  const W = 600, H = 380;
  const stackX = 40, stackY = 60, stackW = 180, stackH = 280;
  const heapX = 340, heapY = 60, heapW = 220, heapH = 280;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dea584"/>
      </marker>
      <marker id="arrow-borrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
      </marker>
      <marker id="arrow-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
      </marker>
      <marker id="arrow-moved" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
      </marker>
    </defs>
    <text x="${stackX}" y="40" class="region-label">Stack</text>
    <rect x="${stackX}" y="${stackY}" width="${stackW}" height="${stackH}" class="region-box" rx="8"/>
    <text x="${heapX}" y="40" class="region-label">Heap</text>
    <rect x="${heapX}" y="${heapY}" width="${heapW}" height="${heapH}" class="heap-box" rx="8"/>
  `;

  // Topic-specific rendering
  if (kind === 'empty') {
    svg += `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="note">ยังไม่มีข้อมูลในหน่วยความจำ</text>`;
  }
  else if (kind === 'dropped') {
    svg += `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="note">คืนหน่วยความจำแล้ว (drop)</text>`;
  }
  else if (topicId === 1) {
    svg += renderTopic1(kind);
  }
  else if (topicId === 2) {
    svg += renderTopic2(kind);
  }
  else if (topicId === 3) {
    svg += renderTopic3(kind);
  }
  else if (topicId === 4) {
    svg += renderTopic4(kind);
  }
  else if (topicId === 5) {
    svg += renderTopic5(kind);
  }
  else if (topicId === 6) {
    svg += renderTopic6(kind);
  }

  svg += '</svg>';
  return svg;
}

/* Helper: draw a variable box on stack */
function stackBox(id, x, y, name, value, type, cls, tag) {
  const w = 160, h = 64;
  let tagHtml = '';
  if (tag) {
    const colors = {
      'owner': '#dea584',
      'mut-owner': '#fbbf24',
      'moved': '#f87171',
      'borrow': '#22d3ee',
      'mut-borrow': '#c084fc',
      'mut-ref-immutable': '#60a5fa',
      'mut-ref-mut': '#c084fc',
      'done': '#6b7280'
    };
    const c = colors[tag] || '#9aa3b2';
    tagHtml = `<text x="${x+w-8}" y="${y+14}" text-anchor="end" class="box-tag" fill="${c}">${tag}</text>`;
  }
  return `
    <g class="box ${cls}" data-id="${id}">
      <rect class="box-rect" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>
      <text x="${x+10}" y="${y+20}" class="box-label">${escapeHtml(name)}</text>
      <text x="${x+10}" y="${y+40}" class="box-value">${escapeHtml(value)}</text>
      <text x="${x+10}" y="${y+56}" class="box-type">${escapeHtml(type)}</text>
      ${tagHtml}
    </g>
  `;
}

/* Helper: heap string box */
function heapString(id, x, y, value, cls='') {
  const w = 180, h = 50;
  return `
    <g class="box ${cls}" data-id="${id}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="rgba(222,165,132,0.1)" stroke="#dea584" stroke-width="1.5"/>
      <text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" class="heap-text">${escapeHtml(value)}</text>
    </g>
  `;
}

/* Helper: arrow */
function arrow(x1, y1, x2, y2, cls, label='', marker='own') {
  const markerId = `arrow-${marker}`;
  let labelHtml = '';
  if (label) {
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    labelHtml = `<text x="${mx}" y="${my-6}" text-anchor="middle" class="arrow-label">${escapeHtml(label)}</text>`;
  }
  return `
    <path class="arrow ${cls}" d="M${x1},${y1} Q${(x1+x2)/2+20},${(y1+y2)/2} ${x2},${y2}" marker-end="url(#${markerId})"/>
    ${labelHtml}
  `;
}

function W() { return 600; }

/* ---------- Render explanation ---------- */
function renderExplain() {
  const topic = TOPICS[state.topicIdx];
  const step = topic.steps[state.stepIdx];
  explainEl.innerHTML = `
    <div class="step-title">
      <span class="step-badge">ขั้นตอน ${state.stepIdx + 1}/${topic.steps.length}</span>
      ${escapeHtml(step.title)}
    </div>
    <div class="explain-section">
      <div class="explain-label">เกิดอะไรขึ้น</div>
      <div class="explain-text">${escapeHtml(step.what)}</div>
    </div>
    <div class="explain-section">
      <div class="explain-label">โค้ดบรรทัดนี้</div>
      <div class="explain-text"><code>${escapeHtml(step.code)}</code></div>
    </div>
    <div class="explain-section">
      <div class="explain-label">ทำไมต้องทำ</div>
      <div class="explain-text">${escapeHtml(step.why)}</div>
    </div>
    <div class="explain-section">
      <div class="explain-label">สถานะปัจจุบัน</div>
      <div class="explain-text">${escapeHtml(step.state)}</div>
    </div>
    <div class="explain-section">
      <div class="explain-label">ขั้นตอนถัดไป</div>
      <div class="explain-text">${escapeHtml(step.next)}</div>
    </div>
  `;
}

/* ---------- Render inspector ---------- */
function renderInspector() {
  const topic = TOPICS[state.topicIdx];
  const step = topic.steps[state.stepIdx];
  if (!step.vars || step.vars.length === 0) {
    inspectorEl.innerHTML = `
      <div class="insp-title">ตัวแปร</div>
      <div class="insp-list">
        <div class="note" style="color:var(--text-mute);font-size:12px;padding:12px;">ยังไม่มีตัวแปรในสโคป</div>
      </div>
    `;
    return;
  }
  inspectorEl.innerHTML = `
    <div class="insp-title">ตัวแปร (${step.vars.length})</div>
    <div class="insp-list">
      ${step.vars.map(v => `
        <div class="insp-row ${v.changed ? 'changed' : ''}">
          <span class="insp-name">${escapeHtml(v.name)}</span>
          <span class="insp-val">${escapeHtml(v.val)}</span>
          <span class="insp-type">${escapeHtml(v.type || '')}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- Render timeline ---------- */
function renderTimeline() {
  const topic = TOPICS[state.topicIdx];
  timelineEl.innerHTML = topic.steps.map((s, i) => {
    let cls = 'tl-step';
    if (i === state.stepIdx) cls += ' active';
    else if (i < state.stepIdx) cls += ' done';
    return `<button class="${cls}" data-step="${i}" title="${escapeHtml(s.title)}">${i+1}. ${escapeHtml(s.title)}</button>`;
  }).join('');
  timelineEl.querySelectorAll('.tl-step').forEach(btn => {
    btn.addEventListener('click', () => {
      state.stepIdx = parseInt(btn.dataset.step);
      renderAll();
    });
  });
}

/* ---------- Render progress ---------- */
function renderProgress() {
  const topic = TOPICS[state.topicIdx];
  const total = topic.steps.length;
  const current = state.stepIdx + 1;
  const pct = (current / total) * 100;
  progressFill.style.width = pct + '%';
  progressText.textContent = `ขั้นตอนที่ ${current} / ${total}`;
  stepCounter.textContent = `${current} / ${total}`;
}

/* ---------- Master render ---------- */
function renderAll() {
  renderTopics();
  renderCode();
  renderVisual();
  renderExplain();
  renderInspector();
  renderTimeline();
  renderProgress();
  updatePlayBtn();
  updateNavBtns();
}

function updatePlayBtn() {
  btnPlay.textContent = state.isPlaying ? '⏸ หยุด' : '▶ เล่น';
}

function updateNavBtns() {
  const topic = TOPICS[state.topicIdx];
  btnPrev.disabled = state.stepIdx === 0;
  btnNext.disabled = state.stepIdx === topic.steps.length - 1;
}

/* ---------- Playback ---------- */
function play() {
  const topic = TOPICS[state.topicIdx];
  if (state.stepIdx >= topic.steps.length - 1) {
    state.stepIdx = 0;
    renderAll();
  }
  state.isPlaying = true;
  updatePlayBtn();
  scheduleNext();
}

function pause() {
  state.isPlaying = false;
  if (state.timer) {
    clearTimeout(state.timer);
    state.timer = null;
  }
  updatePlayBtn();
}

function scheduleNext() {
  if (state.timer) clearTimeout(state.timer);
  if (!state.isPlaying) return;
  const topic = TOPICS[state.topicIdx];
  if (state.stepIdx >= topic.steps.length - 1) {
    pause();
    return;
  }
  const delay = 2200 / state.speed;
  state.timer = setTimeout(() => {
    state.stepIdx++;
    renderAll();
    scheduleNext();
  }, delay);
}

function nextStep() {
  const topic = TOPICS[state.topicIdx];
  if (state.stepIdx < topic.steps.length - 1) {
    state.stepIdx++;
    renderAll();
  }
  if (state.isPlaying) scheduleNext();
}

function prevStep() {
  if (state.stepIdx > 0) {
    state.stepIdx--;
    renderAll();
  }
  if (state.isPlaying) scheduleNext();
}

function replay() {
  pause();
  state.stepIdx = 0;
  renderAll();
}

function setSpeed(speed) {
  state.speed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === speed);
  });
  if (state.isPlaying) {
    // reschedule with new speed
    if (state.timer) clearTimeout(state.timer);
    scheduleNext();
  }
}

/* ---------- Helpers ---------- */
function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- Event bindings ---------- */
btnPlay.addEventListener('click', () => {
  if (state.isPlaying) pause();
  else play();
});
btnPrev.addEventListener('click', prevStep);
btnNext.addEventListener('click', nextStep);
btnReplay.addEventListener('click', replay);
document.querySelectorAll('.speed-btn').forEach(b => {
  b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed)));
});

/* Keyboard navigation */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); state.isPlaying ? pause() : play(); }
});

/* ---------- Init ---------- */
renderAll();
</script>
